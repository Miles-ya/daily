name: Policy monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "7 8-18 * * *"
      timezone: "Asia/Shanghai"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.run.outputs.changed }}
      policy_ids: ${{ steps.run.outputs.policy_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - id: run
        name: Scan and analyze new policies
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.b.ai/v1/chat/completions' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          SITE_BASE_URL: /daily/
        run: |
          daily policy --result-file /tmp/policy-result.json
          echo "changed=$(jq -r '.changed' /tmp/policy-result.json)" >> "$GITHUB_OUTPUT"
          echo "policy_ids=$(jq -r '.policy_ids | join(",")' /tmp/policy-result.json)" >> "$GITHUB_OUTPUT"
      - name: Commit public policy data
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/policies data/policy_assessments data/policy_ai_cache data/policy_logs
          git diff --cached --quiet || git commit -m "data: update policy radar"
          git push
      - uses: actions/configure-pages@v5
        if: steps.run.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: site-output
  deploy-and-notify:
    needs: monitor
    if: needs.monitor.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Send private Telegram brief
        env:
          ENABLE_TELEGRAM: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PERSONAL_PROFILE_JSON: ${{ secrets.PERSONAL_PROFILE_JSON }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.b.ai/v1/chat/completions' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: daily policy-notify --policy-ids "${{ needs.monitor.outputs.policy_ids }}" --site-url "${{ steps.deployment.outputs.page_url }}"
      - name: Commit notification ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notifications/telegram.json
          git diff --cached --quiet || git commit -m "data: record policy notifications"
          git push
