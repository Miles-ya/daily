{% extends "base.html" %}{% block content %}<section class="page-head"><div><h1>当前热点</h1><p>综合经济评分、变化程度与关联资料</p></div></section><ol class="hot-list">{% for event in events[:10] %}<li><span>{{ loop.index }}</span><a href="{{ asset('events/' ~ event.id ~ '/') }}">{{ event.title }}</a><b>{{ event.score }} 热度</b><em>{{ '↑' if event.score >= 80 else '→' }}</em></li>{% endfor %}</ol>{% endblock %}
