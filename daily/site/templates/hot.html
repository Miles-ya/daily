{% extends "base.html" %}{% block content %}<article class="editorial-page"><header class="page-title"><p class="kicker">DAILY / SIGNALS</p><h1>Current Signals</h1><p>综合经济评分、变化程度与关联资料。</p></header><ol class="signal-list">{% for event in events[:10] %}<li><span>{{ "%02d"|format(loop.index) }}</span><a href="{{ asset('events/' ~ event.id ~ '/') }}">{{ event.title }}</a><small>{{ event.score }} / {{ '↑' if event.score >= 80 else '→' }}</small></li>{% endfor %}</ol></article>{% endblock %}
