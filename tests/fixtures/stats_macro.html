<h1>2026年7月份国民经济运行情况</h1><div>发布时间：2026年8月17日</div>
<div class="TRS_Editor"><p>7月份，规模以上工业增加值同比增长5.7%。社会消费品零售总额同比增长4.8%。</p>
<p>1—7月份，固定资产投资同比增长3.2%，其中民间投资下降1.1%。房地产开发投资同比下降8.0%。</p>
<p>全国城镇调查失业率为5.2%。服务业生产指数同比增长6.3%。</p><a href="../sjjd/t20260817_1965057.html">官方解读</a></div></body></html>
